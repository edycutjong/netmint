name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Stage 1 · quality ───────────────────────────────────────────────
  quality:
    name: Stage 1 · lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests with coverage floor
        run: npm run test:coverage
      - name: Replay the committed evidence (every stored row re-derived, 0 differences expected)
        run: npm run verify:flows

  # ── Stage 2 · security (parallel with stage 1) ──────────────────────
  secrets:
    name: Stage 2 · gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Stage 2 · npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit

  dependency-review:
    name: Stage 2 · dependency review (needs a public repo or GitHub Advanced Security)
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  # ── Stage 3 · build, the "unplug it" proof, and a Vercel PREVIEW deploy ─
  build:
    name: Stage 3 · build, offline-must-fail, preview deploy
    needs: [quality, secrets, audit]
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Bundle budget (static assets under 2000 KB)
        run: |
          kb=$(du -sk .next/static | cut -f1)
          echo "static assets: ${kb} KB"
          [ "$kb" -le 2000 ] || { echo "::error::static assets ${kb} KB exceed the 2000 KB budget"; exit 1; }
      - name: Unplug the network, the demo must fail and print no verdict
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          npm run verify:offline
      # Dependabot and fork PRs get no repository secrets, so they skip the preview and stages 4-5 fall back to a local server.
      - name: Deploy a Vercel preview (never production)
        id: deploy
        if: env.VERCEL_TOKEN != ''
        run: |
          npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          COMMIT_SHA="$GITHUB_SHA" npx vercel build --token="$VERCEL_TOKEN"
          url=$(npx vercel deploy --prebuilt -e COMMIT_SHA="$GITHUB_SHA" --token="$VERCEL_TOKEN")
          echo "preview: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # ── Stage 4 · E2E against the preview, the judged click ─────────────
  e2e:
    name: Stage 4 · E2E on the preview
    needs: [build]
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: ${{ needs.build.outputs.preview_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait until the preview reports THIS commit
        if: env.PREVIEW_URL != ''
        run: |
          for _ in $(seq 1 24); do
            sha=$(curl -s -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$PREVIEW_URL/api/health" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).commit||"")}catch{console.log("")}})')
            [ "$sha" = "$GITHUB_SHA" ] && exit 0
            sleep 5
          done
          echo "::error::preview /api/health did not report commit $GITHUB_SHA"; exit 1
      - name: Local server (only when there is no preview, for example a Dependabot PR)
        if: env.PREVIEW_URL == ''
        run: |
          npm run build
          nohup npm start > server.log 2>&1 &
          npx --yes wait-on@8 http://localhost:3000/api/health --timeout 60000
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          COMMIT_SHA: ${{ github.sha }}
      - run: npm run e2e
        env:
          E2E_BASE_URL: ${{ env.PREVIEW_URL != '' && env.PREVIEW_URL || 'http://localhost:3000' }}
          CI: 'true'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Stage 5 · performance gate on the preview ───────────────────────
  lighthouse:
    name: Stage 5 · Lighthouse budget on the preview
    needs: [build, e2e]
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: ${{ needs.build.outputs.preview_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Local server (only when there is no preview)
        if: env.PREVIEW_URL == ''
        run: |
          npm ci
          npm run build
          nohup npm start > server.log 2>&1 &
          npx --yes wait-on@8 http://localhost:3000/api/health --timeout 60000
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Lighthouse (performance >= 0.9, accessibility >= 0.95, best-practices >= 0.95; measured 0.98 / 1 / 1 on 2026-11-21)
        run: |
          target="${PREVIEW_URL:-http://localhost:3000}"
          headers='{}'
          [ -n "$PREVIEW_URL" ] && headers=$(node -e 'console.log(JSON.stringify({"x-vercel-protection-bypass": process.env.VERCEL_AUTOMATION_BYPASS_SECRET}))')
          # shared runners are noisy (0.89 to 0.99 on identical HTML): warm the edge, run three times, gate on the median
          curl -s -o /dev/null -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET:-}" "$target/"
          for i in 1 2 3; do
            npx --yes lighthouse "$target/" --quiet --chrome-flags="--headless=new --no-sandbox" \
              --extra-headers="$headers" \
              --only-categories=performance,accessibility,best-practices --output=json --output-path="lh$i.json"
          done
          node -e '
            const med = (a) => a.sort((x, y) => x - y)[1];
            const runs = [1, 2, 3].map((i) => require("./lh" + i + ".json").categories);
            const got = {};
            for (const k of ["performance", "accessibility", "best-practices"]) got[k] = med(runs.map((c) => c[k].score));
            const min = { performance: 0.9, accessibility: 0.95, "best-practices": 0.95 };
            console.log("median of 3:", got, "performance runs:", runs.map((c) => c.performance.score));
            const bad = Object.keys(min).filter((k) => got[k] < min[k]);
            if (bad.length) { console.error("below budget:", bad.join(", ")); process.exit(1); }'

  # ── Stage 6 · deploy gate (main only): promote the tested preview ───
  deploy:
    name: Stage 6 · deploy gate, promote to production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [quality, secrets, audit, build, e2e, lighthouse]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://netmint.edycu.dev
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PREVIEW_URL: ${{ needs.build.outputs.preview_url }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Promote the exact deployment that passed E2E and Lighthouse
        run: npx vercel promote "$PREVIEW_URL" --yes --token=${{ secrets.VERCEL_TOKEN }}
      - name: Live smoke, https://netmint.edycu.dev must report THIS commit
        run: |
          for _ in $(seq 1 36); do
            sha=$(curl -s https://netmint.edycu.dev/api/health | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).commit||"")}catch{console.log("")}})')
            [ "$sha" = "$GITHUB_SHA" ] && { echo "live commit $sha"; exit 0; }
            sleep 5
          done
          echo "::error::live /api/health did not report commit $GITHUB_SHA"; exit 1

  # ── Release · automatic semantic version after the deploy gate is green ─
  # Replaces the old tag-triggered release.yml (a tag pushed with GITHUB_TOKEN would not trigger it).
  # Its test gate is stages 1-6 above. Uses GITHUB_TOKEN only; the [skip ci] commit starts no run.
  release:
    name: Release · semver from Conventional Commits
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bump, changelog, commit, tag, release (no-op when nothing is releasable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node scripts/release.mjs)
          if [ -z "$version" ]; then echo "no releasable commits since the last tag"; exit 0; fi
          npx prettier --write CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): v$version [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            git tag -f "v$version"
            git push origin HEAD:main "refs/tags/v$version" --force-with-lease="refs/tags/v$version:" && break
            [ "$attempt" = 3 ] && exit 1
          done
          gh release create "v$version" --title "NetMint v$version" --notes-file RELEASE_NOTES.md --verify-tag
