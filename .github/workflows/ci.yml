name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Stage 1 · quality ───────────────────────────────────────────────
  quality:
    name: Stage 1 · lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests with coverage floor
        run: npm run test:coverage
      - name: Replay the committed evidence (every stored row re-derived, 0 differences expected)
        run: npm run verify:flows

  # ── Stage 2 · security (parallel with stage 1) ──────────────────────
  secrets:
    name: Stage 2 · gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Stage 2 · npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit

  dependency-review:
    name: Stage 2 · dependency review (needs a public repo or GitHub Advanced Security)
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ── Stage 3 · build + the "unplug it" proof ─────────────────────────
  build:
    name: Stage 3 · build and offline-must-fail
    needs: [quality, secrets, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Bundle budget (static assets under 2000 KB)
        run: |
          kb=$(du -sk .next/static | cut -f1)
          echo "static assets: ${kb} KB"
          [ "$kb" -le 2000 ] || { echo "::error::static assets ${kb} KB exceed the 2000 KB budget"; exit 1; }
      - name: Unplug the network, the demo must fail and print no verdict
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          npm run verify:offline

  # ── Stage 4 · deploy (main only) ────────────────────────────────────
  deploy:
    name: Stage 4 · deploy to Vercel production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://netmint.edycu.dev
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          COMMIT_SHA: ${{ github.sha }}
      - run: npx vercel deploy --prebuilt --prod -e COMMIT_SHA=${{ github.sha }} --token=${{ secrets.VERCEL_TOKEN }}

  # ── Stage 5 · E2E against the LIVE URL, the judged click ────────────
  e2e:
    name: Stage 5 · E2E on the live URL
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait until /api/health reports THIS commit (not the previous deployment)
        run: |
          for _ in $(seq 1 24); do
            sha=$(curl -s https://netmint.edycu.dev/api/health | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).commit||"")}catch{console.log("")}})')
            [ "$sha" = "$GITHUB_SHA" ] && exit 0
            sleep 5
          done
          echo "::error::/api/health did not report commit $GITHUB_SHA"; exit 1
      - run: npm run e2e
        env:
          E2E_BASE_URL: https://netmint.edycu.dev
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Stage 6 · performance gate on the live URL ──────────────────────
  lighthouse:
    name: Stage 6 · Lighthouse budget
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lighthouse (performance ≥ 0.9, accessibility ≥ 0.95, best-practices ≥ 0.95; measured 0.98 / 1 / 1 on 2026-11-21)
        run: |
          npx --yes lighthouse https://netmint.edycu.dev/ --quiet --chrome-flags="--headless=new --no-sandbox" \
            --only-categories=performance,accessibility,best-practices --output=json --output-path=lh.json
          node -e '
            const c = require("./lh.json").categories;
            const got = { performance: c.performance.score, accessibility: c.accessibility.score, "best-practices": c["best-practices"].score };
            const min = { performance: 0.9, accessibility: 0.95, "best-practices": 0.95 };
            console.log(got);
            const bad = Object.keys(min).filter((k) => got[k] < min[k]);
            if (bad.length) { console.error("below budget:", bad.join(", ")); process.exit(1); }'
