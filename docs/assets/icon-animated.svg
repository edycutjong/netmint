    @keyframes strike{0%,53.8%{transform:scale(1)}54%{transform:scale(1.06)}56.7%{transform:scale(1)}100%{transform:scale(1)}}
    @media (prefers-reduced-motion: reduce){*{animation:none !important}}
  </style>
