<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NetMint — puts each tokenised-stock supply step on trial against the chain and strikes the verdict: A pencilled supply jump meets the chain, lands within remedy, and the hallmark REAL INFLOW strikes beside +$202.83M.">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-8%    steady state: the struck mark — paper plate, verdigris cartouche, inked supply staircase, a punch on each riser (poster rule)
  8-18%   trigger:      the steps go back on trial — verdigris ring lifts to a dashed pencil ring, ink and punches lift to pencil   data-story="beat-2"
  18-54%  mechanism:    A pencilled supply jump meets the chain, lands within remedy, and the hallmark REAL INFLOW strikes beside +$202.83M.   data-story="beat-3"
                        (ink redraws the staircase step by step; a verdigris punch lands on each riser as the ink passes)
  54-66%  resolution:   the verdigris ring strikes back (scale 1.06 → 1.00, 160 ms) around the three punched risers   data-story="beat-4"
  66-100% breathe + seam: the struck mark holds — identical to frame 0, so the restart never cuts
-->
